<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mapa Multi-Usuário Neon</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: sans-serif; background: #1a1a1a; }
        #map { height: 100vh; width: 100vw; }

        /* Tela de Login */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        input { padding: 15px; border-radius: 8px; border: none; width: 250px; margin-bottom: 10px; }
        button { padding: 15px 30px; cursor: pointer; background: #fff; border: none; font-weight: bold; border-radius: 8px; }

        /* Marcador Branco Neon */
        .neon-marker {
            width: 15px; height: 15px;
            background-color: #fff;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .label-nome {
            color: white; font-weight: bold; text-shadow: 0 0 5px black;
            background: rgba(0,0,0,0.5); padding: 2px 5px; border-radius: 4px;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: white;">Quem está acessando?</h1>
    <input type="text" id="userName" placeholder="Digite seu nome...">
    <button onclick="iniciarMapa()">Entrar no Mapa</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    let userMarker;
    let nomeUsuario = "";

    function iniciarMapa() {
        nomeUsuario = document.getElementById('userName').value;
        if (!nomeUsuario) return alert("Por favor, digite seu nome!");

        document.getElementById('login-screen').style.display = 'none';

        // Inicializa o mapa focado no Brasil (exemplo)
        map = L.map('map').setView([-15.78, -47.92], 4);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        capturarLocalizacao();
    }

    function capturarLocalizacao() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((position) => {
                const { latitude, longitude } = position.coords;

                // Aqui você enviaria os dados para o seu servidor/banco de dados
                // Para visualização local imediata:
                atualizarMarcador(latitude, longitude, nomeUsuario);
                
                map.setView([latitude, longitude], 13);
            });
        }
    }

    function atualizarMarcador(lat, lng, nome) {
        // Ícone customizado Neon
        const neonIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="neon-marker"></div><div class="label-nome">${nome}</div>`,
            iconSize:,
            iconAnchor:
        });

        if (userMarker) {
            userMarker.setLatLng([lat, lng]);
        } else {
            userMarker = L.marker([lat, lng], {icon: neonIcon}).addTo(map);
        }
    }
</script>
</body>
</html>
